/* Normalize labels: bọc text node thành <span class="cb-text"> nếu cần và ensure flex */
function normalizeCheckboxLabels(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  // remove accidental <br> if any
  container.querySelectorAll('br').forEach(b => b.remove());
  const labels = container.querySelectorAll('label');
  labels.forEach(label => {
    if (!label.querySelector('.cb-text')) {
      const textNodes = Array.from(label.childNodes).filter(n => n.nodeType === 3 && n.textContent.trim());
      textNodes.forEach(tn => {
        const span = document.createElement('span');
        span.className = 'cb-text';
        span.textContent = tn.textContent.trim();
        tn.parentNode.replaceChild(span, tn);
      });
    }
    // ensure layout
    label.style.display = 'flex';
    label.style.alignItems = 'center';
    label.style.gap = '8px';
    label.style.width = '100%';
  });
}

/* Debounce util */
function debounce(fn, wait) {
  let t;
  return function(...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), wait);
  };
}

/* Attach filter to a container of labels */
function attachFilter(inputId, containerId) {
  const input = document.getElementById(inputId);
  const container = document.getElementById(containerId);
  if (!input || !container) return;
  const labels = () => Array.from(container.querySelectorAll('label'));
  const doFilter = () => {
    const q = input.value.trim().toLowerCase();
    if (!q) {
      labels().forEach(l => l.style.display = 'flex');
      return;
    }
    labels().forEach(l => {
      const txt = (l.textContent || '').toLowerCase();
      const val = l.querySelector('input')?.value.toLowerCase() || '';
      const matched = txt.includes(q) || val.includes(q);
      l.style.display = matched ? 'flex' : 'none';
    });
  };
  input.addEventListener('input', debounce(doFilter, 150));
  input.addEventListener('keydown', (e) => { if (e.key === 'Escape') { input.value = ''; doFilter(); }});
}

// 4) show/hide & populate function
function showPerfumeResult(perfume) {
  const panel = document.getElementById('perfumeResult');
  if (!panel) {
    console.warn("perfumeResult panel not found in DOM");
    return;
  }

  // populate safe access
  const pid = perfume.perfume_id || perfume.ID || perfume.id || 'N/A';
  const title = perfume.title || perfume.perfume_name || perfume.name || '';
  const subtitle = perfume.subtitle || perfume.description || '-';

  document.getElementById('pr-id').textContent = pid;
  document.getElementById('pr-title').textContent = formatTitle(title) || title || 'Unknown';
  document.getElementById('pr-subtitle').textContent = subtitle;

  // build image filename (safe)
  let imgName = '';
  try {
    if (perfume.image_filename) imgName = perfume.image_filename;
    else if (pid && typeof pid === 'string') imgName = `${pid}.png`;
    else if (title) imgName = `${title.replace(/\s+/g,'_')}.png`;
  } catch (e) {
    imgName = 'placeholder.png';
  }

  const bottleImg = document.getElementById('pr-bottle-img');
  const extraImg = document.getElementById('pr-extra-img');
  if (bottleImg) bottleImg.src = `/static/images/${imgName}`;
  if (extraImg) extraImg.src = perfume.extra_image || `/static/images/${imgName}`;

  // stats (coerce numeric)
  const lon = Number(perfume.longevity || 0);
  const sil = Number(perfume.sillage || 0);
  const proj = Number(perfume.projection || 0);

  const lonEl = document.getElementById('pr-longevity');
  const silEl = document.getElementById('pr-sillage');
  const projEl = document.getElementById('pr-projection');
  if (lonEl) lonEl.style.width = percent(lon);
  if (silEl) silEl.style.width = percent(sil);
  if (projEl) projEl.style.width = percent(proj);


  // ---- animation classes ----
  // ensure classes reset
  panel.classList.remove('entering', 'entered', 'show');
  // prepare for enter animation
  panel.style.display = 'flex';
  panel.classList.add('entering');

  // force reflow so transition applies
  // eslint-disable-next-line no-unused-expressions
  void panel.offsetWidth;

  // switch to entered state (triggers CSS transition)
  panel.classList.remove('entering');
  panel.classList.add('entered', 'show');

  // auto-hide handling: clear any previous timer and set new one
  if (window._perfumeResultAutoHideTimer) clearTimeout(window._perfumeResultAutoHideTimer);
  window._perfumeResultAutoHideTimer = setTimeout(() => {
    // animate out: remove 'entered'/'show' so CSS transitions can run
    panel.classList.remove('entered', 'show');
    // after transition time, hide element (240ms matches CSS)
    setTimeout(() => { panel.style.display = 'none'; }, 260);
  }, 12000); // 12s, adjust if needed
}

    }
  }

  if (!id) {
    console.warn('uart_model_result empty payload', payload);
    return;
  }

  id = id.toString().trim();
  console.log("Looking up perfume id in cache:", id);
  const p = findPerfumeById(id);
  console.log("findPerfumeById ->", p);

  if (p) {
    showPerfumeResult(p);
    return;
  }

  // cache miss -> request server for details
  console.log("Cache miss for", id, "-> requesting server get_perfume_by_id");
  socket.emit('get_perfume_by_id', { id });
});

// server trả chi tiết cho get_perfume_by_id
socket.on('perfume_by_id', (perfume) => {
  console.log("Received perfume_by_id from server:", perfume);
  if (!perfume) return;
  // in case server returns array or object
  const item = Array.isArray(perfume) ? perfume[0] : perfume;
  if (!item) return;
  // normalize key
  if (!item.perfume_id && (item.id || item.ID)) item.perfume_id = item.id || item.ID;
  // cache it (put front)
  window.latestPerfumeCatalog = [item].concat(window.latestPerfumeCatalog || []);
  showPerfumeResult(item);
});

});

  </script>
